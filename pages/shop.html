<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Volt Sneaker Store</title>
    <link rel="stylesheet" href="../css/components/navbar.css">
    <link rel="stylesheet" href="../css/pages/shop.css">
    <link rel="stylesheet" href="../css/components/footer.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components/product.css">
</head>

<body>

    <div id="navbar"></div>
    <main>

        <section id="shop-hero">
            <p>COLLECTION 001</p>
            <h1>SHOP ALL</h1>
            <P>Engineered for high-voltage movement. Every silhouette bridges the gap
                between performance culture and high-fashion aesthetics,
                constructed with surgical precision for the urban environment.</P>
            <button class="btn btn-primary">
                <i class="bi bi-arrow-down-short"></i>
            </button>
        </section>
        <section id="shop">
            <div class="shop-navbar">
                <div class="categories">
                    <button class="btn btn-primary">ALL</button>
                    <button class="btn">RUNNING</button>
                    <button class="btn">LIFESTYLE</button>
                    <button class="btn">STREETWEAR</button>
                    <button class="btn">CLASSIC</button>
                </div>
                <div class="search-box">
                    <img src="../assets/icons/search.svg" alt="">
                    <input type="search" placeholder="search">
                </div>
            </div>
            <div id="product-list"></div>
            <button type="button" class="btn btn-outline-secondary">LOAD MORE</button>
        </section>
    </main>
    <footer>

    </footer>
    <script src="../js/shop.js" type="module"></script>
</body>

</html>
